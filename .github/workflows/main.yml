name: Build and publish MO FIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'app/**'
      - 'web/**'
      - 'tools/**'
      - 'package*.json'
      - '*.gradle'
      - 'gradle.properties'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bundle the offline motion player
        run: |
          npm ci
          npm run build

      - name: Verify the viewer offline in Chromium
        run: |
          npx playwright install chromium
          node tools/check-motion.cjs

      - name: Upload viewer screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Motion-QA
          path: motion-qa/
          if-no-files-found: error

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools and SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fL --retry 3 -o /tmp/android-commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p /tmp/android-commandlinetools
            unzip -q /tmp/android-commandlinetools.zip -d /tmp/android-commandlinetools
            mv /tmp/android-commandlinetools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature and package contents
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk MO-FIT-v0.7.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify MO-FIT-v0.7.2.apk
          unzip -t MO-FIT-v0.7.2.apk
          unzip -Z1 MO-FIT-v0.7.2.apk | grep -Fx 'assets/motion-viewer.js'
          for exercise in squat wall bridge; do
            for view in front side three; do
              unzip -Z1 MO-FIT-v0.7.2.apk | grep -Fx "assets/motion/${exercise}-${view}.webp"
            done
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MO-FIT-v0.7.2-APK
          path: MO-FIT-v0.7.2.apk
          if-no-files-found: error

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: MO-FIT-v0.7.2-APK
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the APK offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node tools/check-android-motion.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Motion-QA
          path: android-motion-qa/
          if-no-files-found: error

  publish:
    needs: [android, android-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MO-FIT-v0.7.2-APK
      - name: Publish direct-download preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.7.2-motion-preview
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" MO-FIT-v0.7.2.apk --clobber
          else
            gh release create "$RELEASE_TAG" MO-FIT-v0.7.2.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "MO FIT v0.7.2 Motion Preview" \
              --notes "Android debug APK with an three offline motion exercises rendered from the 3D rig. Playback tested on an offline Android emulator. Movement review and physical device coverage are pending."
          fi
