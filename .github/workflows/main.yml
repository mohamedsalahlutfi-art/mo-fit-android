name: Build and publish MO FIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'MO-FIT-Android-v0.6-GitHub.zip'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect and unpack project
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah
          file MO-FIT-Android-v0.6-GitHub.zip
          unzip -t MO-FIT-Android-v0.6-GitHub.zip | tail -3
          mkdir -p android-project
          unzip -oq MO-FIT-Android-v0.6-GitHub.zip -d android-project
          find android-project -maxdepth 3 -type f | sort | head -40
          test -f android-project/settings.gradle
          test -f android-project/build.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/app/src/main/assets/index.html

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug

      - name: Package APK
        run: |
          set -euxo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk MO-FIT-v0.6.apk
          test -s MO-FIT-v0.6.apk
          ls -lh MO-FIT-v0.6.apk

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: MO-FIT-v0.6-APK
          path: MO-FIT-v0.6.apk
          if-no-files-found: error

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh release view v0.6.0 >/dev/null 2>&1; then
            gh release upload v0.6.0 MO-FIT-v0.6.apk --clobber
          else
            gh release create v0.6.0 MO-FIT-v0.6.apk --title "MO FIT v0.6.0 Android prototype" --notes "Installable Android debug APK. Exercise animations are schematic; not the final 3D version."
          fi
