name: Build and publish MO FIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'MO-FIT-Android-v0.6-GitHub.zip'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract complete Android project
        run: |
          mkdir -p android-project
          unzip -q MO-FIT-Android-v0.6-GitHub.zip -d android-project
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare direct-download APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk MO-FIT-v0.6.apk
          test -s MO-FIT-v0.6.apk

      - name: Publish GitHub Release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: MO FIT v0.6.0 (Android debug)
          files: MO-FIT-v0.6.apk
          overwrite_files: true
          body: |
            Installable Android debug APK of MO FIT v0.6.
            This is a prototype with schematic exercise animation, not the final 3D version.

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MO-FIT-v0.6-APK
          path: MO-FIT-v0.6.apk
