name: Build and publish MO FIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'app/**'
      - 'web/**'
      - 'tools/**'
      - 'package*.json'
      - '*.gradle'
      - 'gradle.properties'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bundle the offline 3D viewer
        run: |
          npm ci
          npm run build

      - name: Verify the viewer offline in Chromium
        run: |
          npx playwright install chromium
          node tools/check-motion.cjs

      - name: Upload viewer screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Motion-QA
          path: motion-qa/
          if-no-files-found: error

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools and SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fL --retry 3 -o /tmp/android-commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p /tmp/android-commandlinetools
            unzip -q /tmp/android-commandlinetools.zip -d /tmp/android-commandlinetools
            mv /tmp/android-commandlinetools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature and package contents
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk MO-FIT-v0.7.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify MO-FIT-v0.7.apk
          unzip -t MO-FIT-v0.7.apk
          unzip -Z1 MO-FIT-v0.7.apk | grep -Fx 'assets/motion-viewer.js'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MO-FIT-v0.7-APK
          path: MO-FIT-v0.7.apk
          if-no-files-found: error

  publish:
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MO-FIT-v0.7-APK
      - name: Publish direct-download preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.7.0-motion-preview
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" MO-FIT-v0.7.apk --clobber
          else
            gh release create "$RELEASE_TAG" MO-FIT-v0.7.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "MO FIT v0.7.0 Motion Preview" \
              --notes "Android debug APK with an offline 3D mannequin and three preview exercise clips. Device and movement review are pending."
          fi
